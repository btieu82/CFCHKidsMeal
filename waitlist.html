<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFCH Waitlist</title>

<style>
body {
    margin: 0;
    background: #df642d;
}

.page {
    position: relative;
    width: 100%;
    max-width: 1366px;
    margin: 0 auto;
}

.page img {
    width: 100%;
    height: auto;
    display: block;
}

.mobile-img {
    display: none;
}

.back-button {
    position: fixed;
    top: 20px;
    left: 20px;

    background: #f4b53f;
    color: white;

    text-decoration: none;
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 18px;

    padding: 10px 22px;

    border: 4px solid black;
    border-radius: 999px;

    box-shadow: 6px 5px 0 #d62c3a;

    z-index: 9999;
}

.click-area {
    position: absolute;
    z-index: 100;
    cursor: pointer;
}

/* Desktop button */
.click-area {
    left: 35%;
    top: 60%;
    width: 30%;
    height: 10%;
}

/* Mobile layout */
@media (max-width: 768px) {

    .desktop-img {
        display: none;
    }

    .mobile-img {
        display: block;
    }

    .page {
        max-width: 414px;
    }

    .back-button {
        font-size: 16px;
        padding: 8px 18px;
    }

    .click-area {
        left: 18%;
        top: 33%;
        width: 68%;
        height: 8%;
    }
}
</style>

</head>

<body>

<a href="index.html" class="back-button">HOME</a>

<div class="page">

```
<img class="desktop-img" src="2.png" alt="Waitlist">
<img class="mobile-img" src="Waitlist-Mobile.png" alt="Waitlist">

<a class="click-area"
   href="https://forms.gle/FLhzJnmqeqn4GWsF9"
   target="_blank"
   aria-label="Add To Waitlist"></a>
```

</div>

</body>
</html>
