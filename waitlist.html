<!DOCTYPE html>
<html>
<head>
    <title>CFCH Waitlist</title>
    <style>
        body {
            margin: 0;
            background: #df5729;
        }

        .page {
            position: relative;
            width: 100%;
            max-width: 1366px;
            margin: 0 auto;
        }

        .page img {
            width: 100%;
            display: block;
        }

        .click-area {
            position: absolute;
            display: block;
            left: 0;
            top: 25%;
            width: 100%;
            height: 50%;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>

<body>

<div class="page">
    <img src="2.png" alt="Waitlist">

    <a class="click-area"
       href="https://forms.gle/FLhzJnmqeqn4GWsF9"
       target="_blank"
       aria-label="Add to waitlist"></a>
</div>

</body>
</html>
