<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFCH Kids' Meals Volunteer Event</title>

    <style>
        body {
            margin: 0;
            background: #000;
            overflow-x: hidden;
        }

        .page {
            position: relative;
            width: 100vw;
            max-width: 1366px;
            margin: 0 auto;
        }

        .page img {
            width: 100vw;
            height: auto;
            display: block;
        }

        .click-area {
            position: absolute;
            display: block;
            cursor: pointer;
            z-index: 10;
        }

        .signup {
            left: 64%;
            top: 27%;
            width: 17%;
            height: 17%;
        }

        .waitlist {
            left: 82%;
            top: 27%;
            width: 17%;
            height: 17%;
        }

        .calendar {
            left: 2%;
            top: 49%;
            width: 20%;
            height: 18%;
        }

        .map {
            left: 38%;
            top: 49%;
            width: 22%;
            height: 18%;
        }

        @media (max-width: 600px) {
            .page {
                width: 100vw;
                max-width: none;
            }

            .page img {
                width: 100vw;
                max-width: none;
            }
        }
    </style>
</head>

<body>

<div class="page">
    <img src="1.png" alt="CFCH Volunteer Event">

    <a class="click-area signup" href="register.html" aria-label="Sign Me Up"></a>
    <a class="click-area waitlist" href="waitlist.html" aria-label="Waitlist"></a>

    <a class="click-area calendar"
       href="https://calendar.app.google/mqHau23fCCbNsg5TA"
       target="_blank"
       aria-label="Add To Calendar"></a>

    <a class="click-area map"
       href="https://maps.app.goo.gl/L1KRmcjvBr65qgsw8"
       target="_blank"
       aria-label="Open Map"></a>
</div>

</body>
</html>
