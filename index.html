<!DOCTYPE html>
<html>
<head>
    <title>CFCH Kids' Meals Volunteer Event</title>

    <style>
        body {
            margin: 0;
            background: #000;
        }

        .page {
            position: relative;
            width: 100%;
            max-width: 1366px;
            margin: 0 auto;
        }

        .page img {
            width: 100%;
            display: block;
        }

        .click-area {
            position: absolute;
            display: block;
            cursor: pointer;
            z-index: 10;
        }

        /* YES! SIGN ME UP */
        .signup {
            left: 58%;
            top: 22%;
            width: 22%;
            height: 22%;
        }

        /* WAITLIST */
        .waitlist {
            left: 79%;
            top: 22%;
            width: 20%;
            height: 22%;
        }

        /* DATE / CALENDAR */
        .calendar {
            left: 2%;
            top: 48%;
            width: 20%;
            height: 20%;
        }

        /* PLACE / MAP */
        .map {
            left: 38%;
            top: 48%;
            width: 22%;
            height: 20%;
        }
    </style>
</head>

<body>

<div class="page">
    <img src="1.png" alt="CFCH Volunteer Event">

    <a class="click-area signup"
       href="register.html"
       aria-label="Sign Me Up"></a>

    <a class="click-area waitlist"
       href="waitlist.html"
       aria-label="Waitlist"></a>

    <a class="click-area calendar"
       href="https://calendar.app.google/mqHau23fCCbNsg5TA"
       target="_blank"
       aria-label="Add to Calendar"></a>

    <a class="click-area map"
       href="https://maps.app.goo.gl/L1KRmcjvBr65qgsw8"
       target="_blank"
       aria-label="Open Map"></a>
</div>

</body>
</html>
