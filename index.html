<!DOCTYPE html>
<html>
<head>
    <title>CFCH Kids' Meals Volunteer Event</title>

    <style>
        body {
            margin: 0;
            background: #000;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        img {
            width: 100%;
            display: block;
            margin: 0 auto;
        }

        .button-container {
            padding: 30px;
            background: #000;
        }

        .btn {
            display: inline-block;
            padding: 18px 32px;
            margin: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }

        .signup {
            background: #9BE564;
            color: #000;
        }

        .waitlist {
            background: #F5A623;
            color: #fff;
        }
    </style>
</head>

<body>

    <img src="1.png" alt="Volunteer Event">

    <div class="button-container">
        <a class="btn signup"
           href="https://kidsmealsinc.volunteerhub.com/vv2/lp/cfch"
           target="_blank">
           YES! SIGN ME UP
        </a>

        <a class="btn waitlist"
           href="https://forms.gle/FLhzJnmqeqn4GWsF9"
           target="_blank">
           ADD TO WAITLIST
        </a>
    </div>

    <img src="2.png" alt="Waitlist">

    <div class="button-container">
        <a class="btn waitlist"
           href="https://forms.gle/FLhzJnmqeqn4GWsF9"
           target="_blank">
           ADD TO WAITLIST
        </a>
    </div>

    <img src="3.png" alt="Registration">

    <div class="button-container">
        <a class="btn signup"
           href="https://kidsmealsinc.volunteerhub.com/vv2/lp/cfch"
           target="_blank">
           REGISTER HERE
        </a>
    </div>

</body>
</html>
