<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFCH Registration</title>

<style>
body {
    margin: 0;
    background: #000;
}

.page {
    position: relative;
    width: 100%;
    max-width: 1366px;
    margin: 0 auto;
}

.page picture,
.page img {
    width: 100%;
    height: auto;
    display: block;
}

.back-button {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #f4b53f;
    color: white;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 18px;
    padding: 10px 22px;
    border: 4px solid black;
    border-radius: 999px;
    box-shadow: 6px 5px 0 #d62c3a;
    z-index: 9999;
}

.click-register,
.click-waitlist {
    position: absolute;
    display: block;
    cursor: pointer;
}

/* ===================== */
/* DESKTOP               */
/* ===================== */

.click-register {
    left: 32%;
    top: 69%;
    width: 36%;
    height: 12%;
    z-index: 200;
}

.click-waitlist {
    left: 20%;
    top: 84%;
    width: 60%;
    height: 10%;
    z-index: 300;
}

/* ===================== */
/* MOBILE                */
/* ===================== */

@media screen and (max-width: 768px) {

    .page {
        max-width: 414px;
    }

    .back-button {
        font-size: 16px;
        padding: 8px 18px;
    }

    .click-register {
        left: 15%;
        top: 44%;
        width: 70%;
        height: 12%;
        z-index: 200;
    }

    .click-waitlist {
        left: 4%;
        top: 57%;
        width: 92%;
        height: 8%;
        z-index: 300;

      
    }
}

</style>
</head>

<body>

<a href="index.html" class="back-button">HOME</a>

<div class="page">

    <picture>
        <source media="(max-width: 768px)" srcset="Register-Mobile.png">
        <img src="3.png" alt="Registration">
    </picture>

    <a class="click-register"
       href="https://kidsmealsinc.volunteerhub.com/vv2/lp/cfch"
       target="_blank"
       aria-label="Register Here"></a>

    <a class="click-waitlist"
       href="https://forms.gle/nQZ7Ejxtsn1WGvYA9"
       target="_blank"
       aria-label="Join Waitlist"></a>

</div>

</body>
</html>
