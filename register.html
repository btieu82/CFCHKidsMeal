<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFCH Registration</title>

<style>
body {
    margin: 0;
    background: #000;
}

.page {
    position: relative;
    width: 100%;
    max-width: 1366px;
    margin: 0 auto;
}

.desktop-img {
    display: block;
    width: 100%;
    height: auto;
}

.mobile-img {
    display: none;
    width: 100%;
    height: auto;
}

.back-button {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #f4b53f;
    color: white;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 18px;
    padding: 10px 22px;
    border: 4px solid black;
    border-radius: 999px;
    box-shadow: 6px 5px 0 #d62c3a;
    z-index: 9999;
}

.click-register,
.click-waitlist {
    position: absolute;
    cursor: pointer;
    display: block;
}

/* Desktop */
.click-register {
    left: 32%;
    top: 69%;
    width: 36%;
    height: 12%;
    z-index: 200;
}

.click-waitlist {
    left: 25%;
    top: 86%;
    width: 55%;
    height: 7%;
    z-index: 100;
}

/* Mobile */
@media screen and (max-width: 768px) {
    .desktop-img {
        display: none !important;
    }

    .mobile-img {
        display: block !important;
    }

    .page {
        max-width: 414px;
    }

    .back-button {
        font-size: 16px;
        padding: 8px 18px;
    }

    .click-register {
        left: 16%;
        top: 45%;
        width: 70%;
        height: 12%;
    }

    .click-waitlist {
        left: 3%;
        top: 80%;
        width: 94%;
        height: 13%;
    }
}
</style>
</head>

<body>

<a href="index.html" class="back-button">HOME</a>

<div class="page">

    <img class="desktop-img" src="3.png" alt="Registration">
    <img class="mobile-img" src="Register-Mobile.png" alt="Registration Mobile">

    <a class="click-register"
       href="https://kidsmealsinc.volunteerhub.com/vv2/lp/cfch"
       target="_blank"
       aria-label="Register Here"></a>

    <a class="click-waitlist"
       href="https://forms.gle/nQZ7Ejxtsn1WGvYA9"
       target="_blank"
       aria-label="Join Waitlist"></a>

</div>

</body>
</html>
